name: Deploy a Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de functions
        working-directory: functions
        run: npm ci

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_B302F }}

      - name: Desplegar a Firebase
        run: npx firebase-tools@15 deploy --only functions,firestore:rules,hosting:devgrullonlabs --project portfolio-b302f --non-interactive
